<!doctype html>
<html lang="az">
<head>

<title>Dropy — Instagram qoşulması</title>
<link rel="stylesheet" href="bridge.css" />
</head>
<body data-platform="instagram">
<main class="card">
  <div id="spinner" class="spinner" role="status" aria-label="Yüklənir"></div>

  <div id="error" class="error" hidden></div>
  <a id="back" class="button" hidden>Tətbiqə qayıt</a>
</main>
<script src="bridge.js"></script>
</body>
</html>
